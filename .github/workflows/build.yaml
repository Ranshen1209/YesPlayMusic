name: Release

env:
  YARN_INSTALL_NOPT: yarn add --ignore-platform --ignore-optional

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Intel runners avoid the current arm64 hosted-runner capacity issue.
        # electron-builder still produces both x64 and arm64 macOS packages.
        os: [macos-15-intel, windows-latest, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v3
        with:
          node-version: '22.23.2'
          cache: 'yarn'

      - name: Force git to use HTTPS for github SSH URLs
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --get-all url."https://github.com/".insteadOf
        shell: bash

      - name: Install RPM & Pacman (on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y rpm &&
          sudo apt-get install --no-install-recommends -y libarchive-tools &&
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - id: get_unm_version
        name: Get the installed UNM version
        run: |
          yarn install --frozen-lockfile --ignore-optional
          unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          echo "unmver=${unm_version}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Verify required customizations and release source
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Release workflow must be dispatched against a v* tag, got ${GITHUB_REF}" >&2
            exit 1
          fi
          yarn verify:customizations
          yarn verify:windows-vibrancy
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi
          echo "Building ${GITHUB_SHA} from ${GITHUB_REF}"
        shell: bash

      - name: Install UNM dependencies for Windows
        if: runner.os == 'Windows'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${{steps.get_unm_version.outputs.unmver}}
        shell: bash

      - name: Install UNM dependencies for macOS
        if: runner.os == 'macOS'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-darwin-x64@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-darwin-arm64@${{steps.get_unm_version.outputs.unmver}} \
            dmg-license
        shell: bash

      - name: Install UNM dependencies for Linux
        if: runner.os == 'Linux'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-linux-x64-gnu@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-linux-arm64-gnu@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-linux-arm-gnueabihf@${{steps.get_unm_version.outputs.unmver}}
        shell: bash

      - name: Build Electron app
        uses: samuelmeuli/action-electron-builder@v1.6.0
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
          VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
          VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67
          # macOS artifacts stay unsigned until a distributable Developer ID
          # identity is available. Keep this explicit on every CI runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        with:
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          # Matrix jobs only build. A single job below publishes after every
          # platform succeeds, preventing split draft releases.
          release: false

          use_vue_cli: true

      - name: Smoke test packaged Windows app and native background
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node scripts/smoke-electron.js dist_electron/win-unpacked/YesPlayMusic.exe

      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          arch="$(node -p 'process.arch')"
          app_dir=mac
          if [[ "$arch" == arm64 ]]; then app_dir=mac-arm64; fi
          node scripts/smoke-electron.js "dist_electron/$app_dir/YesPlayMusic.app/Contents/MacOS/YesPlayMusic"
        shell: bash

      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a node scripts/smoke-electron.js dist_electron/linux-unpacked/yesplaymusic

      - name: Save application smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}
          path: dist_electron/smoke-*.png
          if-no-files-found: ignore

      - name: Normalize Windows release filenames
        if: runner.os == 'Windows'
        run: |
          for file in dist_electron/*.exe dist_electron/*.exe.blockmap; do
            normalized="${file// /-}"
            if [[ "$file" != "$normalized" ]]; then
              mv "$file" "$normalized"
            fi
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: YesPlayMusic-mac
          path: |
            dist_electron/*.dmg
            dist_electron/*.dmg.blockmap
            dist_electron/latest-mac.yml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: YesPlayMusic-win
          path: |
            dist_electron/*.exe
            dist_electron/*.exe.blockmap
            dist_electron/latest.yml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: YesPlayMusic-linux
          path: |
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.rpm
            dist_electron/*.pacman
            dist_electron/*.tar.gz
            dist_electron/latest-linux.yml
          if-no-files-found: error

  publish-release:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all CI platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: YesPlayMusic-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        run: |
          set -e
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          test -f release-assets/latest-linux.yml
          compgen -G 'release-assets/*.dmg' >/dev/null
          compgen -G 'release-assets/*.dmg.blockmap' >/dev/null
          compgen -G 'release-assets/*-Setup-*.exe' >/dev/null
          compgen -G 'release-assets/*.exe.blockmap' >/dev/null
          compgen -G 'release-assets/*.AppImage' >/dev/null
          compgen -G 'release-assets/*.deb' >/dev/null
          compgen -G 'release-assets/*.rpm' >/dev/null
          compgen -G 'release-assets/*.pacman' >/dev/null
          compgen -G 'release-assets/*.tar.gz' >/dev/null

          awk '
            $1 == "-" && $2 == "url:" { print $3 }
            $1 == "path:" { print $2 }
          ' release-assets/latest*.yml | sort -u | while IFS= read -r asset; do
            if [[ ! -f "release-assets/$asset" ]]; then
              echo "Update manifest references missing asset: $asset" >&2
              exit 1
            fi
          done

          find release-assets -maxdepth 1 -type f -print | sort
        shell: bash

      - name: Create one draft release with every CI asset
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --draft
        shell: bash
